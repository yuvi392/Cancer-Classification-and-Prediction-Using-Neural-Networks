{% extends "base.html" %}{% block title %}Analysis | OncoMetric{% endblock %}{% block content %}<section class="container section-space"><div class="page-intro"><div><div class="eyebrow">NEW ANALYSIS</div><h1>Enter measurement profile</h1><p>Provide the 30 numeric measurements in the order shown below. All fields are required.</p></div><div class="step-badge">STEP 1 <span>/</span> 1</div></div><form method="post" class="analysis-form"><div class="row g-3">{% for name in feature_names %}<div class="col-md-6 col-xl-4"><label class="form-label" for="{{ field_key(name) }}">{{ name }}</label><input class="form-control" id="{{ field_key(name) }}" name="{{ field_key(name) }}" type="number" step="any" required></div>{% endfor %}</div><div class="form-actions"><button class="btn btn-primary btn-lg" type="submit">Run analysis <span aria-hidden="true">→</span></button><button class="btn btn-link text-secondary" type="reset">Clear all fields</button></div></form></section>{% endblock %}
